
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # public/ is git-ignored: the hand tracking models are fetched here
      - name: Fetch MediaPipe models
        run: bash scripts/fetch-mediapipe-models.sh

      # Optional, for rooms on difficult networks (docs/multiplayer.md): a
      # TURN server and our own meeting point, from the repository's Actions
      # variables. Unset, they are empty and the build uses the public relays
      # and no TURN server. Variables, not secrets: everything here ends up
      # readable in the page's JavaScript anyway. For a TURN server that
      # stays on, set only VITE_TURN_CREDENTIALS_URL (the address the page
      # fetches expiring credentials from) and leave the other three empty.
      - name: Build
        run: npm run build
        env:
          VITE_TURN_CREDENTIALS_URL: ${{ vars.VITE_TURN_CREDENTIALS_URL }}
          VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.VITE_TURN_CREDENTIAL }}
          VITE_SIGNAL_URLS: ${{ vars.VITE_SIGNAL_URLS }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
