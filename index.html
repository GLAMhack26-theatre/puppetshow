<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SKKG Marionetten Theater</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #120d0b; color: #f3e9dc; font: 13px/1.4 system-ui, sans-serif; }
      #app { position: fixed; inset: 0; touch-action: none; }
      #hud { position: fixed; top: 8px; left: 8px; padding: 6px 8px; background: #0009; border-radius: 6px; white-space: pre; font-family: ui-monospace, monospace; pointer-events: none; }
      #tests { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px; }
      #tests button { cursor: pointer; }
      #tests a, #tests button, #panel button { color: inherit; background: #0009; padding: 6px 8px; border-radius: 6px; text-decoration: none; border: 0; font: inherit; }
      #panel { position: fixed; bottom: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
      #panel label { display: flex; gap: 4px; align-items: center; background: #0009; padding: 4px 8px; border-radius: 6px; }
      /* Old-film vignette over the 3D view (canvas, curtain), under the UI:
         right after #app and without z-index, so every later positioned
         element (buttons, HUD, impro menu and slider) paints over it */
      #vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgb(18 10 6 / 0.35) 78%, rgb(10 5 3 / 0.85) 100%);
        box-shadow: inset 0 0 6vmin 2vmin rgb(10 5 3 / 0.7);
      }
      #preview { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); width: min(440px, 46vw); border-radius: 6px; background: #0009; cursor: move; touch-action: none; overflow: hidden; }
      #preview canvas { display: block; width: 100%; }
      /* Footer of the hand window: the camera's resolution as a segment control (hand-overlay.ts) */
      .preview-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 3px 6px; color: #f3e9dccc; font: 11px/1 system-ui, sans-serif; }
      .preview-footer[hidden] { display: none; }
      .preview-segments { display: flex; border: 1px solid #d8aa4a99; border-radius: 5px; overflow: hidden; }
      .preview-segments button { padding: 3px 8px; color: #f3e9dc; background: none; border: 0; font: inherit; cursor: pointer; }
      .preview-segments button + button { border-left: 1px solid #d8aa4a99; }
      .preview-segments button[aria-pressed="true"] { color: #1a0f0b; background: #e8c478; }
      .preview-segments button:disabled { opacity: 0.5; cursor: progress; }
      /* Debug UI only in debug mode (Shift+D or ?debug, src/ui/debug-mode.ts) */
      body:not(.debug) :is(#tests, #panel, #hud) { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="hud"></div>
    <nav id="tests">
      <a href="?">play</a>
      <a href="?test=world">world</a>
      <a href="?test=puppet">puppet</a>
      <a href="?test=interop">interop</a>
      <a href="?test=nocurtain">impro</a>
      <button id="presentation-button" type="button" title="Presentation (Shift+P)">presentation</button>
    </nav>
    <div id="panel"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
